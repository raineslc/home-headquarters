name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: headquarters_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated-ci-password@localhost:5432/headquarters_test
      DJANGO_SECRET_KEY: isolated-ci-only-never-a-production-secret-483902713469!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test organizer --noinput
      - name: Build the Cloud Run container
        run: docker build --tag hhq-check .
  deploy-cloud-run:
    # Production hosting (FND-03): Google Cloud Run + Neon. Enabled once the GCP_* repository
    # variables exist; authentication uses Workload Identity Federation (no stored keys).
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      REGION: us-east4
      IMAGE: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hhq/app:${{ github.sha }}
      RUNTIME_SA: hhq-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      SECRETS: DJANGO_SECRET_KEY=hhq-django-secret-key:latest,DATABASE_URL=hhq-database-url:latest,GOOGLE_CLIENT_SECRET=hhq-google-client-secret:latest,GOOGLE_TOKEN_KEY=hhq-google-token-key:latest,OPENAI_API_KEY=hhq-openai-api-key:latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: hhq-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Apply migrations (one-off Cloud Run job)
        run: |
          gcloud run jobs deploy hhq-migrate --image "$IMAGE" --region "$REGION" --service-account "$RUNTIME_SA"             --command python --args manage.py,migrate_locked --set-secrets "$SECRETS"             --set-env-vars "APP_HOSTNAME=${{ vars.APP_HOSTNAME }}" --max-retries 0 --task-timeout 600 --quiet
          gcloud run jobs execute hhq-migrate --region "$REGION" --wait --quiet
      - name: Deploy the web service
        run: |
          gcloud run deploy home-headquarters --image "$IMAGE" --region "$REGION" --service-account "$RUNTIME_SA"             --allow-unauthenticated --min-instances 0 --max-instances 2 --memory 512Mi --cpu 1 --concurrency 20             --set-secrets "$SECRETS"             --set-env-vars "APP_HOSTNAME=${{ vars.APP_HOSTNAME }},APP_COMMIT=${{ github.sha }},APP_BRANCH=main,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }},GOOGLE_REDIRECT_URI=https://${{ vars.APP_HOSTNAME }}/connections/google/callback/,OPENAI_MODEL=gpt-5-mini"             --quiet
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://${{ vars.APP_HOSTNAME }}/health/"
