name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: headquarters_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated-ci-password@localhost:5432/headquarters_test
      DJANGO_SECRET_KEY: isolated-ci-only-never-a-production-secret-483902713469!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test organizer --noinput
  deploy:
    # Render's automatic GitHub deploys were missed several times (October 14), so main deploys
    # explicitly after the checks above pass. The hook URL is a repository secret.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set"; exit 1
          fi
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
          echo "Render deploy requested for ${GITHUB_SHA::7}."
