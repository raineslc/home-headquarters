{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Home Headquarters{% endblock %}</title><link rel="stylesheet" href="{% static 'app.css' %}"></head>
<body><a class="skip" href="#main">Skip to content</a><header><a class="brand" href="/">Home Headquarters</a>{% if user.is_authenticated %}<div class="account"><span>{{ user.first_name|default:user.email }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet" type="submit">Sign out</button></form></div>{% endif %}</header>
<main id="main">{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
