# Proposed paid production foundation. Provision only after cost approval.
projects:
  - name: Home Headquarters
    environments:
      - name: production
        databases:
          - name: home-headquarters-db
            plan: 0.1c-256mb
            region: virginia
            postgresMajorVersion: '17'
            diskSizeGB: 1
            ipAllowList: []
        services:
          - type: web
            name: home-headquarters
            runtime: python
            plan: 0.5c-512mb
            region: virginia
            buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
            preDeployCommand: python manage.py migrate_locked
            startCommand: gunicorn hq.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
            healthCheckPath: /health/
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: home-headquarters-db
                  property: connectionString
              - key: DJANGO_SECRET_KEY
                generateValue: true
              - key: BOOTSTRAP_TOKEN
                generateValue: true
              - key: OWNER_EMAIL
                sync: false
              - key: PYTHON_VERSION
                value: 3.13.7
          - type: cron
            name: home-headquarters-jobs
            runtime: python
            plan: 0.5c-512mb
            region: virginia
            schedule: '* * * * *'
            buildCommand: pip install -r requirements.txt
            startCommand: python manage.py run_jobs
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: home-headquarters-db
                  property: connectionString
              - key: DJANGO_SECRET_KEY
                generateValue: true
              - key: PYTHON_VERSION
                value: 3.13.7
